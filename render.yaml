services:
  - type: web
    name: boostx-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 4 backend.app:create_app()"
    preDeployCommand: "flask db upgrade"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: boostx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: boostx-redis
          property: connectionString
      - key: PROVIDER_MODE
        value: live
      - key: PROVIDER_API_URL
        value: https://boostcenter2.com/api/v2
      - key: PROVIDER_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini

  - type: worker
    name: boostx-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "python -m backend.app.workers.scheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boostx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: boostx-redis
          property: connectionString
      - key: PROVIDER_MODE
        value: live
      - key: PROVIDER_API_URL
        value: https://boostcenter2.com/api/v2
      - key: PROVIDER_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini

  - type: redis
    name: boostx-redis
    ipAllowList: []
    plan: free

databases:
  - name: boostx-db
    databaseName: boostx_db
    user: boostx
    plan: free
